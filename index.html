<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Max Verstappen — Profile</title>
<link rel="stylesheet" href="style.css">

<style>
/* พื้นหลังรูป + เบลอ */
body {
    background: url("b17a1e100c484f1ef1dc44c91c99c430.jpg") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Cinzel', serif;
    color: #f4e2c2;
}

/* ชั้นเบลอทับ */
.blur-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(8px);
    background: rgba(0, 0, 0, 0.45);
    z-index: -1;
}
</style>
</head>

<body>

<!-- ชั้นเบลอพื้นหลัง -->
<div class="blur-overlay"></div>

    <!-- HEADER -->
    <header style="text-align:center; padding: 60px 20px;">
        <h1 style="font-size: 3rem; letter-spacing:3px; color:#ff7b00; text-shadow:0 0 15px #ff5500;">
            MAX VERSTAPPEN
        </h1>
        <p style="font-size: 1rem; opacity: 0.85; letter-spacing:2px;">
            The Arcane Racer • Flamebound Warrior of Speed • Master of the Orange Storm
        </p>
    </header>

    <!-- PROFILE IMAGE -->
    <section style="text-align:center; margin-top: 30px;">
        <img src="e82b80b806051b909638255f23e129ce.jpg" 
             alt="Max Verstappen" 
             style="width:220px; height:220px; border-radius:50%; border:3px solid #ff7b00; box-shadow:0 0 25px #ff7b00;">
        <p style="font-size:0.8rem; opacity:0.6; margin-top:10px;">
        </p>
    </section>

    <!-- MENU BUTTONS -->
    <section style="margin-top: 50px; display:flex; flex-direction:column; align-items:center; gap:20px;">
        
        <button class="menu-btn" onclick="window.location.href='about.html'">ABOUT ME</button>
        <button class="menu-btn" onclick="openModal('rules')">MY RULES</button>
        <button class="menu-btn" onclick="openModal('gallery')">PICTURES</button>
        <button class="menu-btn" onclick="openModal('playlist')">PLAYLIST</button>
        <button class="menu-btn" onclick="openModal('socials')">SOCIALS</button>

    </section>

    <!-- FOOTER -->
    <footer style="text-align:center; margin-top:80px; padding-bottom:30px; color:#aa8260;">
        © Roleplay — Max Verstappen Edition
    </footer>

</body>
</html>

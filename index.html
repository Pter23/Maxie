<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Max Verstappen — Profile</title>
<link rel="stylesheet" href="style.css">

<style>
/* พื้นหลังรูป + เบลอ */
body {
    background: url("b17a1e100c484f1ef1dc44c91c99c430.jpg") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Cinzel', serif;
    color: #f4e2c2;
}

/* ชั้นเบลอทับ */
.blur-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(8px);
    background: rgba(0, 0, 0, 0.45);
    z-index: -1;
}

/* MODAL OVERLAY */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(6px);
    background: rgba(0, 0, 0, 0.6);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

/* MODAL BOX */
.modal-content {
    background: rgba(20, 8, 0, 0.85);
    border: 2px solid #ff7b00;
    box-shadow: 0 0 25px #ff7b00;
    padding: 25px;
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    color: #f4e2c2;
    animation: popUp 0.35s ease;
}

/* TITLE */
.modal-title {
    text-align: center;
    font-size: 1.7rem;
    letter-spacing: 2px;
    color: #ff7b00;
    text-shadow: 0 0 10px #ff5500;
    margin-bottom: 10px;
}

/* DESCRIPTION */
.modal-desc {
    text-align: center;
    font-size: 0.9rem;
    opacity: 0.75;
    margin-bottom: 15px;
}

/* CLOSE BUTTON */
.close-btn {
    width: 100%;
    margin-top: 15px;
    padding: 10px 0;
    border: none;
    background: #ff7b00;
    color: #000;
    font-weight: bold;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.close-btn:hover {
    background: #ff5500;
}

/* POPUP ANIMATION */
@keyframes popUp {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}
    
    
</style>
</head>

<body>

<!-- ชั้นเบลอพื้นหลัง -->
<div class="blur-overlay"></div>

    <!-- HEADER -->
    <header style="text-align:center; padding: 60px 20px;">
        <h1 style="font-size: 3rem; letter-spacing:3px; color:#ff7b00; text-shadow:0 0 15px #ff5500;">
            MAX VERSTAPPEN
        </h1>
        <p style="font-size: 1rem; opacity: 0.85; letter-spacing:2px;">
            The Arcane Racer • Flamebound Warrior of Speed • Master of the Orange Storm
        </p>
    </header>

    <!-- PROFILE IMAGE -->
    <section style="text-align:center; margin-top: 30px;">
        <img src="IMG_20260201_202759.png" 
             alt="Max Verstappen" 
             style="width:220px; height:220px; border-radius:50%; border:3px solid #ff7b00; box-shadow:0 0 25px #ff7b00;">
        <p style="font-size:0.8rem; opacity:0.6; margin-top:10px;">
        </p>
    </section>

    <!-- MENU BUTTONS -->
    <section style="margin-top: 50px; display:flex; flex-direction:column; align-items:center; gap:20px;">
        
        <button class="menu-btn" onclick="window.location.href='about.html'">ABOUT ME</button>
        <button class="menu-btn" onclick="window.location.href='rules.html'">MY RULES</button>
        <button class="menu-btn" onclick="window.location.href='pics.html'">PICTURES</button>
        <button class="menu-btn" onclick="openModal('playlist')">PLAYLIST</button>
        <button class="menu-btn instagram-btn"
onclick="window.open('https://www.instagram.com/maxi.e7741?igsh=MWozenNqZ2U1YnFqMQ==', '_blank')">INSTAGRAM</button>

    </section>

    <!-- FOOTER -->
    <footer style="text-align:center; margin-top:80px; padding-bottom:30px; color:#aa8260;">
        © Roleplay — Max Verstappen Edition
    </footer>

    <!-- PLAYLIST MODAL -->
<div id="playlistModal" class="modal">
    <div class="modal-content">

        <h2 class="modal-title">🔥 MAX'S PLAYLIST — THE ORANGE STORM 🔥</h2>

        <p class="modal-desc">
            Handpicked tracks that fuel the speed, the focus, and the fire.  
            A soundtrack for victories — on and off the track.
        </p>

        <!-- Spotify Embed -->
        <iframe style="border-radius:12px"
            src="https://open.spotify.com/embed/playlist/4jV5pnGhfrnxDAklMQZVHJ?utm_source=generator"
            width="100%" height="350" frameBorder="0" allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

        <button class="close-btn" onclick="closeModal()">CLOSE</button>
    </div>
</div>

<script>
function openModal(id) {
    document.getElementById("playlistModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("playlistModal").style.display = "none";
}
</script>
    

</body>
</html>
